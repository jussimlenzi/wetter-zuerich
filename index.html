<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="color-scheme" content="light"><title>Wetter Zürich – E-Ink</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;color:#000}body{font-family:Arial,Helvetica,sans-serif;font-weight:700;overflow:hidden}.page{height:100vh;min-height:320px;padding:2.5vh 3vw;display:grid;grid-template-rows:auto 1fr auto;gap:1.8vh}header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #000;padding-bottom:1.2vh}.place{font-size:clamp(25px,4.1vw,62px);font-weight:900;letter-spacing:.04em}.headerRight{text-align:right}.date{font-size:clamp(19px,2.8vw,40px);font-weight:900}.updated{font-size:clamp(13px,1.65vw,24px);margin-top:.35vh}.main{display:grid;grid-template-columns:1.35fr 1fr;gap:3vw;align-items:center}.nowWrap{display:flex;flex-direction:column;justify-content:center}.todayLabel{font-size:clamp(18px,2.5vw,36px);font-weight:900;letter-spacing:.08em;margin-bottom:1vh}.now{display:grid;grid-template-columns:auto 1fr;gap:2vw;align-items:center}.icon{font-size:clamp(72px,14vw,195px);line-height:.82}.temp{font-size:clamp(82px,16vw,220px);font-weight:900;line-height:.75;letter-spacing:-.07em}.condition{font-size:clamp(19px,3vw,43px);margin-top:2vh}.details{border-left:4px solid #000;padding-left:3vw;display:grid;gap:2.6vh;font-size:clamp(21px,3.25vw,46px)}.detail{display:flex;justify-content:space-between;gap:2vw;align-items:baseline}.detail strong{font-weight:900;white-space:nowrap}.forecast{border-top:4px solid #000;padding-top:1.3vh;display:grid;grid-template-columns:repeat(4,1fr)}.day{text-align:center;padding:0 1vw;border-right:2px solid #000}.day:last-child{border-right:0}.dow{font-size:clamp(19px,2.8vw,40px);font-weight:900}.dayicon{font-size:clamp(30px,5.2vw,72px);line-height:1.05;margin:.35vh 0}.temps{display:flex;justify-content:center;align-items:baseline;gap:.4em;white-space:nowrap}.high{font-size:clamp(22px,3.25vw,46px);font-weight:900}.low{font-size:clamp(16px,2.35vw,34px);font-weight:700}.rain{font-size:clamp(14px,1.9vw,27px);margin-top:.45vh}#error{display:none;position:fixed;inset:0;background:#fff;padding:8vw;font-size:5vw;z-index:5}
</style></head><body><div class="page"><header><div class="place">ZÜRICH</div><div class="headerRight"><div class="date" id="date">—</div><div class="updated" id="updated">Stand: —</div></div></header><main class="main"><section class="nowWrap"><div class="todayLabel">HEUTE</div><div class="now"><div class="icon" id="nowIcon">—</div><div><div class="temp"><span id="temp">--</span>°</div><div class="condition" id="condition">Wetter wird geladen</div></div></div></section><section class="details"><div class="detail"><span>Tag / Nacht</span><strong><span id="max">--</span>° / <span id="min">--</span>°</strong></div><div class="detail"><span>Regen</span><strong><span id="rain">--</span> %</strong></div><div class="detail"><span>Wind</span><strong><span id="wind">--</span> km/h <span id="windDir"></span></strong></div></section></main><section class="forecast" id="forecast"></section></div><div id="error">Wetterdaten konnten nicht geladen werden.<br><br>Bitte Internetverbindung prüfen.</div>
<script>
const LAT=47.3769,LON=8.5417;const weather=c=>c===0?["SUN","Sonnig"]:[1,2].includes(c)?["PARTLY","Leicht bewölkt"]:c===3?["CLOUD","Bewölkt"]:[45,48].includes(c)?["FOG","Nebel"]:[51,53,55,56,57].includes(c)?["RAIN","Nieselregen"]:[61,63,65,66,67,80,81,82].includes(c)?["RAIN","Regen"]:[71,73,75,77,85,86].includes(c)?["SNOW","Schnee"]:[95,96,99].includes(c)?["STORM","Gewitter"]:["CLOUD","Wetter"];const symbol=k=>({SUN:"☀",PARTLY:"◒",CLOUD:"☁",FOG:"≋",RAIN:"☂",SNOW:"✳",STORM:"⚡"}[k]||"●");const days=["SO","MO","DI","MI","DO","FR","SA"],round=x=>Math.round(Number(x));function arrow(d){return["↑","↗","→","↘","↓","↙","←","↖"][Math.round((d%360)/45)%8]}function setDate(){document.getElementById("date").textContent=new Intl.DateTimeFormat("de-CH",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric",timeZone:"Europe/Zurich"}).format(new Date())}function setUpdated(iso){document.getElementById("updated").textContent="Stand: "+new Intl.DateTimeFormat("de-CH",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Zurich"}).format(new Date(iso))}
async function loadWeather(){const p=new URLSearchParams({latitude:LAT,longitude:LON,timezone:"Europe/Zurich",current:"temperature_2m,weather_code,wind_speed_10m,wind_direction_10m",daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",forecast_days:5});const r=await fetch("https://api.open-meteo.com/v1/forecast?"+p);if(!r.ok)throw Error();const d=await r.json(),[k,l]=weather(d.current.weather_code);nowIcon.textContent=symbol(k);temp.textContent=round(d.current.temperature_2m);condition.textContent=l;min.textContent=round(d.daily.temperature_2m_min[0]);max.textContent=round(d.daily.temperature_2m_max[0]);rain.textContent=round(d.daily.precipitation_probability_max[0]);wind.textContent=round(d.current.wind_speed_10m);windDir.textContent=arrow(d.current.wind_direction_10m);setUpdated(d.current.time);forecast.innerHTML="";for(let i=1;i<5;i++){const dt=new Date(d.daily.time[i]+"T12:00:00"),[dk]=weather(d.daily.weather_code[i]),e=document.createElement("div");e.className="day";e.innerHTML='<div class="dow">'+days[dt.getDay()]+'</div><div class="dayicon">'+symbol(dk)+'</div><div class="temps"><span class="high">'+round(d.daily.temperature_2m_max[i])+'°</span><span class="low">/ '+round(d.daily.temperature_2m_min[i])+'°</span></div><div class="rain">Regen '+round(d.daily.precipitation_probability_max[i])+' %</div>';forecast.appendChild(e)}}setDate();loadWeather().catch(()=>error.style.display="block");setInterval(()=>loadWeather().catch(()=>{}),3600000);
</script></body></html>
