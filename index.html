<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="color-scheme" content="light"><title>Wetter Zürich – E-Ink</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;color:#000}body{font-family:Arial,Helvetica,sans-serif;font-weight:700;overflow:hidden}.page{height:100vh;min-height:320px;padding:2.5vh 3vw;display:grid;grid-template-rows:auto 1fr auto;gap:1.8vh}header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #000;padding-bottom:1.2vh}.place{font-size:clamp(25px,4.1vw,62px);font-weight:900;letter-spacing:.04em}.headerRight{text-align:right}.date{font-size:clamp(19px,2.8vw,40px);font-weight:900}.updated{font-size:clamp(13px,1.65vw,24px);margin-top:.35vh}.main{display:grid;grid-template-columns:1.35fr 1fr;gap:3vw;align-items:center}.nowWrap{display:flex;flex-direction:column;justify-content:center}.todayLabel{font-size:clamp(18px,2.5vw,36px);font-weight:900;letter-spacing:.06em;margin-bottom:1vh}.todayLabel .slash{font-weight:500;margin:0 .18em}.todayMax{font-size:clamp(17px,2.35vw,34px);font-weight:700;margin-top:1.3vh}.todayMax strong{font-size:1.28em;font-weight:900}.now{display:grid;grid-template-columns:auto 1fr;gap:2vw;align-items:center}.icon{display:flex;align-items:center;justify-content:center;font-size:clamp(80px,15.7vw,218px);line-height:.82}.temp{font-size:clamp(82px,16vw,220px);font-weight:900;line-height:.75;letter-spacing:-.07em}.condition{font-size:clamp(19px,3vw,43px);margin-top:2vh}.details{border-left:4px solid #000;padding-left:3vw;display:grid;gap:2.15vh;font-size:clamp(21px,3.25vw,46px)}.detail{display:flex;justify-content:space-between;gap:2vw;align-items:baseline}.detail strong{font-weight:900;white-space:nowrap}.forecast{border-top:4px solid #000;padding-top:1.3vh;display:grid;grid-template-columns:repeat(4,1fr)}.day{text-align:center;padding:0 1vw;border-right:2px solid #000}.day:last-child{border-right:0}.dow{font-size:clamp(19px,2.8vw,40px);font-weight:900}.dayicon{display:flex;align-items:center;justify-content:center;font-size:clamp(30px,5.2vw,72px);line-height:1.05;margin:.35vh 0}.temps{display:flex;justify-content:center;align-items:baseline;gap:.4em;white-space:nowrap}.high{font-size:clamp(22px,3.25vw,46px);font-weight:900}.low{font-size:clamp(16px,2.35vw,34px);font-weight:700}.rain{font-size:clamp(14px,1.9vw,27px);margin-top:.45vh}#error{display:none;position:fixed;inset:0;background:#fff;padding:8vw;font-size:5vw;z-index:5}

.main{grid-template-columns:1.72fr .58fr!important;gap:2.3vw!important}
.details{font-size:clamp(15px,2.05vw,29px)!important;padding-left:2.3vw!important;gap:1.75vh!important}
.detail{gap:1.2vw!important}
.todayHeading{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.3vw;margin-bottom:2.5vh}
.todayHeading span{height:2px;background:#111}
.todayHeading b{font-size:clamp(18px,2.35vw,34px);font-weight:900;letter-spacing:.05em}
.todayGrid{display:grid;grid-template-columns:1.05fr 1fr 1fr;align-items:stretch;column-gap:1.2vw}
.weatherNow,.tempColumn{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.tempColumn{border-left:2px solid #111;padding-left:1.2vw}
.heroIcon{font-size:clamp(70px,12.7vw,176px)!important;line-height:.82!important;flex:1;display:flex!important;align-items:center!important;justify-content:center!important}
.heroTemp{font-size:clamp(72px,13.3vw,184px)!important;line-height:.82!important;flex:1;display:flex;align-items:center}
.weatherText,.heroCaption{font-size:clamp(15px,2.05vw,29px)!important;font-weight:900!important;line-height:1.05!important;margin:1.2vh 0 0!important;min-height:1.15em;display:flex;align-items:flex-end;justify-content:center;text-align:center;white-space:nowrap}

/* V3.8 – kompakte, feste Höhenverhältnisse wie in der freigegebenen Vorschau */
.page{
  padding:2.0vh 3vw!important;
  grid-template-rows:14% 47% 39%!important;
  gap:0!important;
}
header{
  height:100%!important;
  padding-bottom:1.0vh!important;
  align-items:center!important;
}
.main{
  height:100%!important;
  align-items:stretch!important;
  padding:1.0vh 0 .7vh!important;
}
.nowWrap{
  height:100%!important;
  justify-content:flex-start!important;
}
.todayHeading{
  margin:0 0 .7vh!important;
}
.todayGrid{
  flex:1!important;
  min-height:0!important;
  height:calc(100% - 4.2vh)!important;
}
.details{
  align-self:center!important;
}
.forecast{
  height:100%!important;
  margin:0!important;
  padding-top:.8vh!important;
  align-items:stretch!important;
}
.day{
  height:100%!important;
  display:flex!important;
  flex-direction:column!important;
  justify-content:flex-start!important;
  padding-top:.35vh!important;
}
</style></head><body><div class="page"><header><div class="place">ZÜRICH</div><div class="headerRight"><div class="date" id="date">—</div><div class="updated" id="updated">Stand: —</div></div></header><main class="main"><section class="nowWrap">
  <div class="todayHeading"><span></span><b>HEUTE</b><span></span></div>
  <div class="todayGrid">
    <div class="weatherNow">
      <div class="icon heroIcon" id="nowIcon">—</div>
      <div class="condition weatherText" id="condition">Wetter wird geladen</div>
    </div>
    <div class="tempColumn">
      <div class="temp heroTemp"><span id="temp">--</span>°</div>
      <div class="heroCaption">AKTUELL</div>
    </div>
    <div class="tempColumn">
      <div class="temp heroTemp"><span id="maxLeft">--</span>°</div>
      <div class="heroCaption">MAX.</div>
    </div>
  </div>
</section><section class="details"><div class="detail"><span>Nacht</span><strong style="font-size:.82em"><span id="min">--</span>°</strong></div><div class="detail"><span>Regen</span><strong><span id="rain">--</span> %</strong></div><div class="detail"><span>Wind</span><strong><span id="wind">--</span> km/h <span id="windDir" style="font-size:1.45em;font-weight:900;line-height:0;vertical-align:-0.08em"></span></strong></div><div class="detail"><span>Zürichsee</span><strong><span id="waterTemp">--</span>°</strong></div></section></main><section class="forecast" id="forecast"></section></div><div id="error">Wetterdaten konnten nicht geladen werden.<br><br>Bitte Internetverbindung prüfen.</div>
<script>
const LAT=47.3769,LON=8.5417;const weather=c=>c===0?["SUN","Sonnig"]:[1,2].includes(c)?["PARTLY","Leicht bewölkt"]:c===3?["CLOUD","Bewölkt"]:[45,48].includes(c)?["FOG","Nebel"]:[51,53,55,56,57].includes(c)?["RAIN","Nieselregen"]:[61,63,65,66,67,80,81,82].includes(c)?["RAIN","Regen"]:[71,73,75,77,85,86].includes(c)?["SNOW","Schnee"]:[95,96,99].includes(c)?["STORM","Gewitter"]:["CLOUD","Wetter"];const symbol=k=>{
 const common='viewBox="0 0 100 100" width="1em" height="1em" aria-hidden="true"';
 if(k==="SUN")return `<svg ${common}><circle cx="50" cy="50" r="18" fill="currentColor"/><g stroke="currentColor" stroke-width="7" stroke-linecap="square"><path d="M50 5v18M50 77v18M5 50h18M77 50h18M18 18l13 13M69 69l13 13M82 18L69 31M31 69L18 82"/></g></svg>`;
 if(k==="PARTLY")return `<svg ${common}><g stroke="currentColor" stroke-width="6"><circle cx="37" cy="34" r="15" fill="none"/><path d="M37 7v9M37 52v8M10 34h9M55 34h8M18 15l7 7M51 48l7 7M56 15l-7 7"/></g><path d="M25 75c0-11 9-20 20-20 5 0 10 2 13 5 3-8 10-13 19-13 12 0 21 9 21 21 0 3-1 5-1 7H25z" fill="currentColor"/></svg>`;
 if(k==="CLOUD")return `<svg ${common}><path d="M13 70c0-12 10-22 22-22 4-14 16-23 31-23 17 0 31 13 32 30 1 2 2 6 2 9 0 12-10 22-22 22H34C22 86 13 80 13 70z" fill="currentColor"/></svg>`;
 if(k==="FOG")return `<svg ${common}><g stroke="currentColor" stroke-width="7"><path d="M12 32h76M20 50h68M12 68h76"/></g></svg>`;
 if(k==="RAIN")return `<svg ${common}><path d="M14 54c0-11 9-20 20-20 5-13 16-21 30-21 16 0 29 12 31 28 3 3 5 8 5 13H14z" fill="currentColor"/><g stroke="currentColor" stroke-width="6"><path d="M30 65l-8 20M52 65l-8 20M74 65l-8 20"/></g></svg>`;
 if(k==="SNOW")return `<svg ${common}><g stroke="currentColor" stroke-width="6"><path d="M50 10v80M15 30l70 40M85 30L15 70M50 10l-8 10M50 10l8 10M50 90l-8-10M50 90l8-10"/></g></svg>`;
 if(k==="STORM")return `<svg ${common}><path d="M15 48c0-12 10-21 22-21 5-11 15-17 27-17 17 0 31 13 32 30H15z" fill="currentColor"/><path d="M57 45L38 72h15l-8 22 27-32H57z" fill="currentColor"/></svg>`;
 return "●";
};const days=["SO","MO","DI","MI","DO","FR","SA"],round=x=>Math.round(Number(x));function arrow(d){return["↑","↗","→","↘","↓","↙","←","↖"][Math.round((d%360)/45)%8]}function setDate(){document.getElementById("date").textContent=new Intl.DateTimeFormat("de-CH",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric",timeZone:"Europe/Zurich"}).format(new Date())}function setUpdated(iso){document.getElementById("updated").textContent="Stand: "+new Intl.DateTimeFormat("de-CH",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Zurich"}).format(new Date(iso))}
async function loadWeather(){const p=new URLSearchParams({latitude:LAT,longitude:LON,timezone:"Europe/Zurich",current:"temperature_2m,weather_code,wind_speed_10m,wind_direction_10m",daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",forecast_days:5});const r=await fetch("https://api.open-meteo.com/v1/forecast?"+p);if(!r.ok)throw Error();const d=await r.json(),[k,l]=weather(d.current.weather_code);nowIcon.innerHTML=symbol(k);temp.textContent=round(d.current.temperature_2m);condition.textContent=l;min.textContent=round(d.daily.temperature_2m_min[0]);maxLeft.textContent=round(d.daily.temperature_2m_max[0]);rain.textContent=round(d.daily.precipitation_probability_max[0]);wind.textContent=round(d.current.wind_speed_10m);windDir.textContent=arrow(d.current.wind_direction_10m);setUpdated(d.current.time);forecast.innerHTML="";for(let i=1;i<5;i++){const dt=new Date(d.daily.time[i]+"T12:00:00"),[dk]=weather(d.daily.weather_code[i]),e=document.createElement("div");e.className="day";e.innerHTML='<div class="dow">'+days[dt.getDay()]+'</div><div class="dayicon">'+symbol(dk)+'</div><div class="temps"><span class="high">'+round(d.daily.temperature_2m_max[i])+'°</span><span class="low">/ '+round(d.daily.temperature_2m_min[i])+'°</span></div><div class="rain">Regen '+round(d.daily.precipitation_probability_max[i])+' %</div>';forecast.appendChild(e)}}
async function loadWaterTemp(){
 try{
   const parts=new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit",timeZone:"Europe/Zurich"}).formatToParts(new Date());
   const obj=Object.fromEntries(parts.map(x=>[x.type,x.value]));
   const today=`${obj.year}-${obj.month}-${obj.day}`;
   const url="https://tecdottir.metaodi.ch/measurements/mythenquai?startDate="+today+"&limit=1000";
   const r=await fetch(url,{cache:"no-store"});
   if(!r.ok)throw Error("API "+r.status);
   const d=await r.json();
   const rows=Array.isArray(d.result)?d.result:[];
   const valid=rows.filter(x=>{
     const w=x&&x.values&&x.values.water_temperature;
     return w && w.value!==null && w.value!==undefined && w.value!=="" && Number.isFinite(Number(w.value));
   });
   if(!valid.length)throw Error("no water value");
   valid.sort((a,b)=>new Date(b.timestamp||0)-new Date(a.timestamp||0));
   const wt=Number(valid[0].values.water_temperature.value);
   document.getElementById("waterTemp").textContent=wt.toFixed(1).replace(".",",");
 }catch(e){
   document.getElementById("waterTemp").textContent="--";
 }
}
setDate();
loadWeather().catch(()=>setTimeout(()=>loadWeather().catch(()=>error.style.display="block"),15000));
loadWaterTemp();
setInterval(()=>loadWeather().catch(()=>{}),3600000);
setInterval(loadWaterTemp,3600000);
</script></body></html>
